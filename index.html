<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Zoom Meeting</title>
    <style>
        /* 16:9 Aspect Ratio Container for Responsiveness */
        .zoom-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
            overflow: hidden;
        }

        .zoom-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="zoom-container">
        <!-- 
          CRITICAL: "allow" attributes are strictly required for the 
          browser to let Zoom access the user's hardware.
        -->
        <iframe 
            src="https://app.zoom.us/wc/6585698693/start?fromPWA=1&ref_from=waffle_home&pwd=ZUxCZEFQZlBwZTQ4RnB1MFpsNTAxQT09" 
            allow="camera; microphone; fullscreen; display-capture; clipboard-write"
            sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
        </iframe>
    </div>

</body>
</html>
